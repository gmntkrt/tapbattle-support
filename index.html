
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapBattle | Support</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d1020;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    main { max-width: 720px; margin: 65px auto; padding: 24px; }
    h1 { font-size: 38px; margin-bottom: 5px; }
    h2 { color: #ffb74d; margin-top: 32px; }
    p { color: #d4d9e7; }
    .card {
      background: #1a2037;
      border: 1px solid #303955;
      border-radius: 18px;
      padding: 25px;
      margin-top: 24px;
    }
    .languages { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: #303955; color: white; border: 0;
      border-radius: 10px; padding: 10px 16px; cursor: pointer;
    }
    button.active { background: #ff9633; color: #171717; }
    a { color: #ffb74d; }
    footer { color: #8993aa; margin-top: 40px; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>⚡ TapBattle</h1>
  <p id="subtitle">Game Support</p>

  <div class="languages">
    <button onclick="setLanguage('en')" id="en">🇬🇧 English</button>
    <button onclick="setLanguage('de')" id="de">🇩🇪 Deutsch</button>
    <button onclick="setLanguage('tr')" id="tr">🇹🇷 Türkçe</button>
  </div>

  <div class="card">
    <h2 id="heading">Need help?</h2>
    <p id="description">
      If you have questions, encounter a problem or want to share feedback about TapBattle, please contact our support team.
    </p>
    <h2 id="contactHeading">Contact</h2>
    <p id="contactText">Please send your message to the support email address below.</p>
    <p><a id="emailLink" href="#">Contact support</a></p>
  </div>

  <footer>© 2026 Osman Kurt · TapBattle</footer>
</main>

<script>
  // Replace this with the real support email address before publishing.
  const supportEmail = "smnkurt@outlook.com";

  const translations = {
    en: {
      subtitle: "Game Support",
      heading: "Need help?",
      description: "If you have questions, encounter a problem or want to share feedback about TapBattle, please contact us.",
      contactHeading: "Contact",
      contactText: "Send your message to the email address below.",
      email: "Email support"
    },
    de: {
      subtitle: "Spiel-Support",
      heading: "Brauchst du Hilfe?",
      description: "Wenn du Fragen hast, ein Problem auftritt oder du Feedback zu TapBattle geben möchtest, kontaktiere uns.",
      contactHeading: "Kontakt",
      contactText: "Schreibe uns an die folgende E-Mail-Adresse.",
      email: "Support kontaktieren"
    },
    tr: {
      subtitle: "Oyun Destek Sayfası",
      heading: "Yardıma mı ihtiyacın var?",
      description: "TapBattle hakkında soruların, yaşadığın bir sorun veya önerilerin varsa bizimle iletişime geçebilirsin.",
      contactHeading: "İletişim",
      contactText: "Aşağıdaki e-posta adresinden bize ulaşabilirsin.",
      email: "Destek ekibine e-posta gönder"
    }
  };

  function setLanguage(lang) {
    const t = translations[lang];
    for (const key of ["subtitle", "heading", "description", "contactHeading", "contactText"]) {
      document.getElementById(key).textContent = t[key];
    }
    const link = document.getElementById("emailLink");
    link.textContent = t.email + " — " + supportEmail;
    link.href = "mailto:" + supportEmail;

    for (const code of Object.keys(translations)) {
      document.getElementById(code).classList.toggle("active", code === lang);
    }
    document.documentElement.lang = lang;
  }

  const preferred = navigator.language.slice(0, 2);
  setLanguage(translations[preferred] ? preferred : "en");
</script>
</body>
</html>
